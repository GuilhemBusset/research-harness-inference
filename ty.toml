# ty (https://docs.astral.sh/ty/) for the repository's Python: the implement loop engine, the
# hygiene scanner, the backlog tooling, the measurement recorder, the examiner pilot, the CDK app, its
# services and the tests. From the repository root:
#
#   uv run --locked ty check
#
# scripts/check.sh fast runs exactly that, locally and in CI's `required` check. ty and the pytest
# it resolves the tests' imports against are pinned in pyproject.toml and uv.lock. ty is beta and
# changes diagnostics between releases, so the pin is exact and a bump is its own pull request.

[environment]
# The oldest Python the repository supports (pyproject.toml), on the one platform it runs on.
python-version = "3.12"
python-platform = "linux"
# The project environment `uv sync --locked` creates.
python = ".venv"
# The folders these programs and tests put on sys.path for their imports. After the tools come the
# Python roots of the "Repository layout" (system design, section 8.1), the same list as
# `pythonpath` in pyproject.toml; tests/unit/test_layout.py holds them together. ty refuses a root
# that does not exist, so each folder holds a file from the start.
root = [
    "tools/implementation-loop", "tools/implementation-loop/tests",
    "tools/hygiene",
    "tools/backlog", "tools/backlog/tests",
    "tools/measurements",
    "tools/examiner-pilot",
    "tests/examiner",
    "tests/replay",
    "src",
    "services/common",
    "services/gateway",
    "services/issuer",
    "services/scaler",
    "services/reporter",
    "services/engine/lifecycle",
    "services/engine/mock",
    "client",
    "admin",
    "dashboards",
    "scripts/pipeline",
    "spikes",
]

[src]
# What is checked: the tools, the app's entry point (app.py, which arrives with the CDK app), the
# roots above and the tests.
include = [
    "tools/implementation-loop", "tools/hygiene", "tools/backlog", "tools/measurements", "tools/examiner-pilot",
    "app.py",
    "src",
    "services/common",
    "services/gateway",
    "services/issuer",
    "services/scaler",
    "services/reporter",
    "services/engine/lifecycle",
    "services/engine/mock",
    # The vLLM image's copy program for the fallback loader: one file, in a folder that is no root.
    "services/engine/vllm/fetch_model.py",
    "client",
    "admin",
    "dashboards",
    "scripts/pipeline",
    "spikes",
    "tests",
]
# The task spike S3 gives each harness, and its reference fix, are input to a harness, not this
# project's code: the task is incomplete on purpose. ruff.toml leaves the same two folders out.
exclude = ["spikes/s3_task", "spikes/s3_reference"]

[terminal]
error-on-warning = true
