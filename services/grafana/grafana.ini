; Grafana behind the load balancer's sign-in (system design, section 7.4).
; The load balancer authenticates against Cognito and sets the identity header;
; Grafana has no login of its own. The domain comes from the deployment
; environment (GF_SERVER_DOMAIN), never from this file.

[server]
http_port = 3000
root_url = https://%(domain)s/grafana/
serve_from_sub_path = true

[auth]
disable_login_form = true
; Lets the Prometheus data source sign its requests to the workspace.
sigv4_auth_enabled = true

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[auth.proxy]
enabled = true
; The header the load balancer sets after its Cognito sign-in.
header_name = X-Amzn-Oidc-Identity
header_property = username
; The user the header names is created on its first request.
auto_sign_up = true

[users]
allow_sign_up = false

[security]
disable_initial_admin_creation = true
