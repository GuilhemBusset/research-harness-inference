# The two data sources, and nothing else. Each has a fixed identifier, which the
# dashboards name. Both authenticate with the task's role: no credential here.
apiVersion: 1

prune: true

datasources:
  - name: Prometheus
    uid: rhi-prometheus
    type: prometheus
    access: proxy
    # The workspace's address, from the deployment environment.
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: false
    jsonData:
      sigV4Auth: true
      sigV4AuthType: default
      sigV4Region: ${AWS_REGION}
      httpMethod: POST

  # CloudWatch metrics and CloudWatch Logs, through the one data source.
  - name: CloudWatch
    uid: rhi-cloudwatch
    type: cloudwatch
    editable: false
    jsonData:
      authType: default
      defaultRegion: ${AWS_REGION}
