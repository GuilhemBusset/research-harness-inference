# The collector of an instance: rhi-collector runs the OpenTelemetry collector (the contrib
# distribution) with this file (system design, "What happens on an instance" and "Observability").
# It is the only way an instance's numbers and lines leave it: the engine's metrics route is on
# localhost only.
#
# Metrics: the engine at port 8000, the lifecycle agent at port 9110 and the host, pushed to the
# Prometheus workspace with signed remote write. Every series carries the labels pool, instance
# (the instance's ID, in place of the scrape address) and instance_type, because the engine labels
# its series with the model's name only, and the dashboards take rates per instance.
#
# Logs: the journal of the instance's units and of no other, written to the pool's log group, one
# stream per instance. A line is shipped as it was written, with the name of the unit that wrote
# it: the journal's other fields, the command line among them, stay on the instance.
#
# What the unit gives (the issue that writes rhi-collector.service):
# - RHI_POOL, RHI_WORKSPACE_URL (the workspace's remote-write address), RHI_REGION and
#   RHI_LOG_GROUP in the environment. Nothing here names an address, a region, an account or a
#   log group;
# - journalctl and the right to read the journal;
# - the directory /var/lib/rhi-collector (StateDirectory=rhi-collector), where the place reached in
#   the journal is kept, so that a line is shipped once across restarts of the collector and of the
#   instance.
# The instance's ID and type come from the instance metadata, which the collector reads with a
# session token (IMDSv2). A collector that cannot read them does not start: it never pushes a
# series under the scrape address, which is the same on every instance.
#
# The component names and options are those of collector release 0.165.0, and
# `otelcol-contrib validate` of that release accepts this file.

extensions:
  sigv4auth:
    region: ${env:RHI_REGION}
    service: aps
  file_storage:
    directory: /var/lib/rhi-collector
    create_directory: true

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: engine
          scrape_interval: 15s
          static_configs:
            - targets: ["127.0.0.1:8000"]
        - job_name: lifecycle
          scrape_interval: 15s
          static_configs:
            - targets: ["127.0.0.1:9110"]
  host_metrics:
    collection_interval: 15s
    scrapers:
      cpu:
      memory:
      disk:
      # The space used on the disks. Not the container runtime's mounts nor the memory-backed
      # ones: they are views of the same disks, or of memory.
      filesystem:
        include_fs_types:
          match_type: strict
          fs_types: [ext4, xfs]
  journald:
    # GPU pools add rhi-dcgm to the instance; on the others the unit does not exist and has no line.
    units:
      - rhi-boot.service
      - rhi-engine.service
      - rhi-lifecycle.service
      - rhi-collector.service
      - rhi-dcgm.service
    # Every line of these units, whatever its priority: the receiver's own default stops at info.
    priority: debug
    # A line in full, however long: the journal otherwise gives no text for one over 4096 bytes.
    all: true
    # A line with a character that does not print, a colour among them, comes as bytes: as text.
    convert_message_bytes: true
    # The boot unit has written its lines before the collector starts.
    start_at: beginning
    storage: file_storage
    operators:
      - type: move
        id: unit
        from: body._SYSTEMD_UNIT
        to: attributes.unit
      - type: move
        id: line
        from: body.MESSAGE
        to: body

processors:
  resource_detection:
    detectors: [ec2]
    fail_on_missing_metadata: true
    ec2:
      # The instance's ID (host.id) and type (host.type), and nothing else.
      resource_attributes:
        cloud.account.id: {enabled: false}
        cloud.availability_zone: {enabled: false}
        cloud.platform: {enabled: false}
        cloud.provider: {enabled: false}
        cloud.region: {enabled: false}
        host.image.id: {enabled: false}
        host.name: {enabled: false}
  resource/origin:
    attributes:
      # The exporters make service.instance.id the label instance and the log stream's name.
      - key: service.instance.id
        from_attribute: host.id
        action: upsert
      - key: instance_type
        from_attribute: host.type
        action: upsert
      - key: pool
        value: ${env:RHI_POOL}
        action: upsert

exporters:
  prometheus_remote_write:
    http:
      endpoint: ${env:RHI_WORKSPACE_URL}
      auth:
        authenticator: sigv4auth
    # A series is named by its metric and its labels, not by the collector's version.
    disable_scope_info: true
    resource_constant_labels:
      included: [pool, instance_type]
  awscloudwatchlogs:
    region: ${env:RHI_REGION}
    log_group_name: ${env:RHI_LOG_GROUP}
    log_stream_name: "{InstanceId}"

service:
  extensions: [sigv4auth, file_storage]
  pipelines:
    metrics:
      receivers: [prometheus, host_metrics]
      processors: [resource_detection, resource/origin]
      exporters: [prometheus_remote_write]
    logs:
      receivers: [journald]
      processors: [resource_detection, resource/origin]
      exporters: [awscloudwatchlogs]
