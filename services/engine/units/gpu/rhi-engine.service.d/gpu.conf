# The engine on a GPU instance (system design, "What happens on an instance"). The boot program
# installs the files of this folder only on an instance whose PCI bus lists an NVIDIA device, so
# the mock pool's instances, which have no GPU and no NVIDIA runtime, never read this one.
#
# It adds to the options of the engine's container, and restates nothing of rhi-engine.service:
# - the NVIDIA runtime, with every GPU of the instance;
# - AWS_REGION, which the engine's S3 streamer needs to reach the model bucket. Its value is
#   that of RHI_REGION, which the boot program writes to release.env.
#
# systemd puts no variable's value into this line, and a dollar sign is itself here: the start
# shell of rhi-engine.service reads the words, and gives RHI_REGION its value.

[Service]
Environment='RHI_ENGINE_OPTIONS=--runtime nvidia --gpus all --env "AWS_REGION=$RHI_REGION"'
