# The collector on a GPU instance (system design, "What happens on an instance"). The boot
# program installs the files of this folder only on an instance whose PCI bus lists an NVIDIA
# device, and it starts the collector's unit, not the exporter's.
#
# It adds one thing to rhi-collector.service and restates nothing of it: the collector's unit
# wants the DCGM exporter's, so starting the collector starts the exporter. It only wants it: a
# collector whose exporter fails still ships the engine's metrics and the units' journal.

[Unit]
Wants=rhi-dcgm.service
