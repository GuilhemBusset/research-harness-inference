# Per-role settings for the live agents of the implement loop.
#
# effort:       low | medium | high | xhigh | max (Claude); Codex uses it as model_reasoning_effort.
# timeout_s:    a call taking longer is killed and retried (twice), then the step stops.
# claude_model: alias or full id for `claude --model`; "" uses your Claude Code default.
# claude_fallback_model: the model a call asks for instead while `claude_model` refuses calls
#               (its usage limit reached, or rate limited). The refused attempt is charged to
#               nothing; the role keeps the fallback for 30 minutes, then asks its own model again.
#               "" or absent: no fallback, and the issue waits as an outage.
# codex_model:  model for `codex exec -m`; "" uses your Codex default.
# codex_escalated_model: model for `codex exec -m` on a call the adapter escalates (ADR 0001,
#               amendment 13): deciding requests among which is a `protected_change`, any arbitration,
#               and examining a head whose change against its base adds, changes or removes a
#               protected path (`PROTECTED_*` and `SAFETY_SURFACE_*` in config.py). "" or absent: such
#               a call runs on `codex_model`.
# codex_fallback_model: the model a Codex call asks for instead while the model it asked for refuses
#               calls (its usage limit or quota reached, rate limited, or not available to the
#               account), as `claude_fallback_model` does for Claude: the refused attempt is charged to
#               nothing, and the role keeps the fallback for 30 minutes. "" or absent: no fallback.
#
# max_budget_usd: Claude only: `claude --max-budget-usd` for one call of the role; the call stops
#               there and is not tried again. Provisional values (ADR 0001, decision 8): they are
#               set from the first epic's measured cost. Codex reports tokens, not dollars.
#
# Explorers are cheap fact-finders; every other role works at high effort. Each issue has a
# persistent call ceiling and a dollar ceiling (config.py, ADR 0012, ADR 0001); every call's cost
# and tokens are logged to <run dir>/agents.jsonl.
#
# Roles here (ADR 0001, decision 2): with operator `claude`, plan and build run on Claude Fable,
# on Claude Opus while Fable refuses calls, and explore on a cheap Claude model; triage, examine,
# decide and arbitrate go to the other vendor, Codex, on its default model. The
# escalated calls of examine, decide and arbitrate (above) run on Codex `gpt-6.2-astra`, and on
# `gpt-6.2-sol`, the default, while astra refuses calls (ADR 0001, amendment 13).

[roles.explore]
effort = "low"
timeout_s = 900
claude_model = "sonnet"
codex_model = ""
max_budget_usd = 2

[roles.plan]
effort = "high"
timeout_s = 1800
claude_model = "claude-fable-5-2"
claude_fallback_model = "claude-opus-5-5"
max_budget_usd = 8

[roles.triage]
effort = "high"
timeout_s = 1200

[roles.build]
effort = "high"
timeout_s = 5400
claude_model = "claude-fable-5-2"
claude_fallback_model = "claude-opus-5-5"
max_budget_usd = 25

[roles.examine]
effort = "high"
timeout_s = 3600
codex_escalated_model = "gpt-6.2-astra"
codex_fallback_model = "gpt-6.2-sol"

[roles.decide]
effort = "high"
timeout_s = 1800
codex_escalated_model = "gpt-6.2-astra"
codex_fallback_model = "gpt-6.2-sol"

[roles.arbitrate]
effort = "high"
timeout_s = 1200
codex_escalated_model = "gpt-6.2-astra"
codex_fallback_model = "gpt-6.2-sol"

# What this host cannot provide (ADR 0012; ADR 0001, decision 6). Only these make an item the
# owner's; the doctor adds what it can verify (missing API keys, a WSL host lacking native
# Linux). Agents have network access, Python through uv, and Node; they hold no AWS credentials
# and never call `aws` or deploy.
[host]
lacks = [
  "aws:account",
  "aws:deployed-environment",
  "aws:console",
  "gpu:capacity",
  "human:owner-decision",
  # No container runtime on this host (ADR 0001, amendment 5): a test that starts a container
  # lives under `tests/container/`, outside the local gate, and runs only in CI, in the job
  # `container-tests`, which is part of `required`. An item that rests on such a test names this
  # capability, and `ci_jobs` below maps it to that job: when the issue lands, the engine reads
  # the job's check run on the head that was merged, and a success proves the item, with the
  # check run's address as its evidence. With no such check run, a skipped one or one that did
  # not succeed, the item ends as an obligation on a `delivered` issue, as it does for an item
  # that names no test under `tests/container/` (backlog E0-17 adds the job).
  "host:container-runtime",
]
# For a capability listed above, the name of the CI job that provides it: its check run on the
# merged head discharges the obligation. A capability with no entry here stays the owner's.
ci_jobs = { "host:container-runtime" = "container-tests" }

# Safety invariants: a finding that names one blocks even when it quotes no ledger item, and from
# an issue's fourth examination on only such a finding blocks. Each names a specific harm: a broad
# name ("data loss", "a false done") matches almost any finding, and the bound then never applies.
# This is the only list of them: the engine and its tests read it here, and an engine whose
# loop.toml gives no names refuses to start.
[invariants]
names = [
  "secret exposure",
  "a ci job, gate script, git hook or required check weakened",
  "stored data deleted or made unrecoverable",
  "cross-run corruption",
  "a status or measurement published as success when it failed",
  "an item or check reported as passed that did not pass",
  "edits to another issue's merged deliverable",
  "an aws account id, arn or secret committed",
  "an iam policy broader than the issue requires",
  "a resource exposed to the internet without the issue asking",
  "a pipeline, ruleset or gate change that bypasses review",
]

# The deployment verdict of a merge (ADR 0001, decision 5 and amendment 4). The pipeline posts a
# commit status per stage on each merge commit, and the engine reads them between the merge and
# the evidence step: every context listed here must report success before the issue's evidence is
# recorded, a failure or an error takes the broken-main path, and nothing else lands meanwhile.
# `contexts` stays empty: with no context nothing is waited for and every merge lands at once. The
# owner sets it, through a pull request of their own, if the merge queue should wait for the
# pipeline (docs/factory/green-light.md, step 11). The verification still proves smoke-test items,
# after the fact and with nothing held, through `discharge_contexts`. No other key is accepted in
# this table.
[deploy]
# The contexts to wait for, such as "deploy/<stage>" and later "verify/<stage>".
contexts = []
# Seconds one run polls for a verdict. Past it the issue waits and the supervisor's next run
# reads the same merge commit again; the timeout never fails an issue.
timeout_s = 3600
# The description the pipeline's reporter gives a pending status while the deployment waits for
# the owner's approval. A pending status that carries it makes the issue wait with the kind
# `owner_approval`, with no timeout, and lets other issues land meanwhile. Empty: never.
approval_description = ""
# The verification contexts ("verify/<stage>", and no other form) the engine reads only to
# discharge, after the fact, and never waits for: on each run, for each delivered issue that still
# owes an item needing aws:deployed-environment that names a test under `tests/smoke/`, it reads
# them on the issue's merge commit, and, failing a verified success there, on the head of `main`
# when that commit's history holds the merge commit. A success with exactly `verified_description`
# proves the item, on the terms `unverified_tests` adds: its box is ticked, its evidence
# recorded, and the issue closes once every box is. Nothing is held and nothing waits:
# what is not there yet is read again by the next run. `tests/unit/test_deploy_settings.py` holds
# each to a verification context the reporter posts. "verify/Rhi" is the stage the pipeline deploys.
discharge_contexts = ["verify/Rhi"]
# The description the reporter gives the success of a "verify/<stage>" status when the
# verification's smoke tests ran and passed. A verification also succeeds without running a test
# (no canary key, no listener, a parked system), with another description. When a configured
# "verify/<stage>" succeeded with exactly this description, an item that needs
# aws:deployed-environment and names a test under `tests/smoke/` is proven by that status and is
# not left to the owner. Empty: never. `tests/unit/test_deploy_settings.py` holds both
# descriptions equal to the reporter's constants.
verified_description = "The verification's tests ran and passed."
# The smoke test files of which the verification leaves a test out (`scripts/pipeline/verify.py`
# deselects, in its run on the mock pool, the test that only a GPU pool passes): an item that
# names one of them stays the owner's, whatever the verification's status says. Absent: the table
# does not say what the verification leaves out, and a verification discharges nothing.
# `tests/unit/test_deploy_settings.py` holds it equal to the files of the tests the verification's
# own run deselects, and names them when it fails. An empty list says that every smoke test is run.
unverified_tests = ["tests/smoke/deployed/test_gpu_release.py"]

# The sandbox every agent call and every check command runs in (ADR 0001, decision 3;
# docs/factory/isolation.md). The root filesystem is read-only, `/tmp` and the home directory
# are empty, and only what is listed here and what the engine names for the call (the worktree,
# its private git directory, the run's package caches) is bound back in. `~` is the home
# directory; a path that does not exist on this host is skipped. This table is the allow-list:
# it is on the safety surface, and the doctor's canary fails if it lets a credential through.
[sandbox]
# Read-only: the tools. Never a directory that also holds a login, a token or a history.
toolchain = [
  "~/.local/bin",                  # the claude, codex and uv launchers
  "~/.local/share/claude",         # the Claude Code binaries those launchers point to
  "~/.codex/packages",             # the Codex binary: it lives in Codex's own directory
  "~/.local/share/uv/python",      # the Pythons uv manages
  "~/.local/share/mise/installs",  # Node, installed by mise
]
# Replaced by empty directories before anything is bound: every home directory, the sockets of
# the session and of local services (`/run`), and other filesystems (`/mnt`, `/media`). On a WSL
# host `/mnt` holds the Windows drives and a second mount of this very filesystem, and `/run` the
# socket that starts Windows programs.
hide = ["/home", "/root", "/run", "/mnt", "/media", "/var/tmp"]

# Read-write, for that vendor's own calls only: the one file its login is kept in (it is
# rewritten when a token is refreshed). Not the vendor's directory: that also holds the owner's
# session history for every project, and hooks, plugins and MCP servers the owner's next session
# would run outside the sandbox. A file bound this way can be rewritten in place, not replaced by
# another file (docs/factory/isolation.md, "The vendor's login").
[sandbox.login]
claude = ["~/.claude/.credentials.json"]
codex = ["~/.codex/auth.json"]

# Read-only, for that vendor's own calls only.
[sandbox.settings]
claude = []
codex = ["~/.codex/config.toml"]   # the owner's default model; the engine disables its MCP servers by name
