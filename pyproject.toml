# One uv project for the whole repository (docs/design/system-design.md, "Repository layout"): the
# factory's tooling, the CDK app, its constructs and their tests. It is not a package and nothing
# installs it.
[project]
name = "research-harness-inference"
version = "0"
description = "A scale-to-zero inference endpoint on AWS, written with Python CDK and built by a software factory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# What the CDK app runs on, each pinned to an exact version (docs/design/evidence.md, E20).
# constructs is pinned at the version the lock resolves for aws-cdk-lib: bump the two together.
# The CDK CLI is pinned apart, in package.json. tests/unit/test_toolchain.py checks these pins.
dependencies = [
    "aws-cdk-lib==2.276.0",
    "constructs==10.8.1",
    "cdk-nag==3.0.2",
]

# Exact pins, shared with the vendored implement loop (tools/implementation-loop/UPSTREAM.md) so
# its tests and lint pass unchanged. Three of them are named in other files as well, and move
# only together with those:
#   ruff           required-version in ruff.toml
#   pytest, xdist  the engine tests command in scripts/check.sh, and the engine's own pytest pin
# ty is beta and changes diagnostics between releases: a bump is its own pull request.
[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-xdist==3.8.0",
    "ruff==0.17.3",
    "ty==0.0.95",
]

[tool.uv]
package = false

# `uv run pytest` runs these. The implement loop's tests have their own command and their own
# Python (scripts/check.sh engine-tests), so they are not listed here.
[tool.pytest.ini_options]
testpaths = ["tools/hygiene/tests", "tools/backlog/tests", "tests"]
# A test module is imported under a name made from its path, not its bare file name, so two test
# files of one name in different folders (tests/synth/test_pipeline.py and
# tests/policy/test_pipeline.py) are both collected, with no `__init__.py` in the tests tree.
addopts = ["--import-mode=importlib"]
# The Python roots of the "Repository layout" (system design, section 8.1): one package under each,
# and scripts/pipeline, whose scripts are modules the tests import by name. A new module goes into
# an existing root; ruff.toml (`src`) and ty.toml (`root`, `include`) list the same folders, and
# tests/unit/test_layout.py holds the three lists together.
pythonpath = [
    "src",
    "services/common",
    "services/gateway",
    "services/issuer",
    "services/scaler",
    "services/reporter",
    "services/engine/lifecycle",
    "services/engine/mock",
    "client",
    "admin",
    "dashboards",
    "scripts/pipeline",
    # Not a root of the layout. The implement loop's tests (scripts/check.sh engine-tests) read
    # this configuration too, and import their helpers and each other by bare name, which the
    # default import mode allowed by putting each test file's folder on the path.
    "tools/implementation-loop/tests",
]
