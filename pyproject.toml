# One uv project for the whole repository (docs/design/system-design.md, "Repository layout"): the
# factory's tooling, the CDK app, its constructs and their tests. It is not a package and nothing
# installs it.
[project]
name = "research-harness-inference"
version = "0"
description = "A scale-to-zero inference endpoint on AWS, written with Python CDK and built by a software factory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# What the CDK app runs on, each pinned to an exact version (docs/design/evidence.md, E20).
# constructs is pinned at the version the lock resolves for aws-cdk-lib: bump the two together.
# The CDK CLI is pinned apart, in package.json. tests/unit/test_toolchain.py checks these pins.
# boto3, the AWS SDK, is here for one use: the ssm source and the writer of src/rhi/config.py,
# which read the configuration from SSM and write it there. It is the version the service groups
# below carry (one lock holds one version); tests/unit/test_config_ssm.py checks this pin.
dependencies = [
    "aws-cdk-lib==2.276.0",
    "constructs==10.8.1",
    "cdk-nag==3.0.2",
    "boto3==1.43.126",
]

# Exact pins, shared with the vendored implement loop (tools/implementation-loop/UPSTREAM.md) so
# its tests and lint pass unchanged. Three of them are named in other files as well, and move
# only together with those:
#   ruff           required-version in ruff.toml
#   pytest, xdist  the engine tests command in scripts/check.sh, and the engine's own pytest pin
# ty is beta and changes diagnostics between releases: a bump is its own pull request.
# PyYAML reads CI's workflow file in tests/unit/test_ci_workflow.py: the standard library has no
# YAML parser.
[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-xdist==3.8.0",
    "pyyaml==6.0.3",
    "ruff==0.17.3",
    "ty==0.0.95",
    # An in-process DynamoDB that evaluates condition expressions, which botocore's Stubber cannot.
    "moto[dynamodb]==5.2.5",
    # Lints every synthesized template and the templates under setup/, in
    # tests/synth/test_cfn_lint.py (system design, section 8.3).
    "cfn-lint==1.60.1",
    # Every service group, so that the tests and ty see every library a service imports.
    { include-group = "gateway" },
    { include-group = "mock-engine" },
    { include-group = "scaler" },
    { include-group = "reporter" },
    { include-group = "issuer" },
    { include-group = "lifecycle" },
    { include-group = "admin" },
    { include-group = "cli" },
]
# One group per service: every library the service imports, through rhi_common included, each at
# one exact version, the same in every group that names it (one lock holds one version). A
# function's bundle and an image's requirements file install a service's group from uv.lock
# (src/rhi/packaging.py), so a library belongs to the group of each service that imports it and to
# no other. boto3 is the AWS SDK, and brings botocore at the same version. The CDK libraries stay
# in the project's own dependencies: no service carries them. tests/synth/test_packaging.py checks
# these pins.
gateway = [
    "starlette==1.10.0",
    "httpx==0.28.1",
    # Without its optional native extras (uvloop, httptools), which this load does not need.
    "uvicorn==0.54.0",
    "prometheus-client==0.26.0",
    "boto3==1.43.126",
]
mock-engine = [
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "prometheus-client==0.26.0",
]
scaler = [
    "boto3==1.43.126",
    "protobuf==7.36.2",
    # Snappy as prebuilt wheels, with no system library.
    "cramjam==2.14.0",
]
reporter = [
    "boto3==1.43.126",
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
]
issuer = ["boto3==1.43.126"]
lifecycle = [
    "boto3==1.43.126",
    "prometheus-client==0.26.0",
]
admin = ["boto3==1.43.126"]
# client/pyproject.toml, from which students install the CLI, declares the same requirement.
cli = ["keyring==25.7.0"]

[tool.uv]
package = false

# `uv run pytest` runs these. The implement loop's tests have their own command and their own
# Python (scripts/check.sh engine-tests), so they are not listed here.
#
# tests/container/ is left out: its tests start a container, and the host of the coding agents
# has no container runtime (tests/container/README.md). `norecursedirs` keeps a run that names no
# path, such as scripts/check.sh tests, from entering the folder; a run that names the folder, as
# scripts/check.sh container-tests does, still collects it. The other entries are pytest's own
# defaults, which a value here replaces.
[tool.pytest.ini_options]
testpaths = ["tools/hygiene/tests", "tools/backlog/tests", "tools/measurements/tests", "tests"]
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "tests/container",
]
# A test module is imported under a name made from its path, not its bare file name, so two test
# files of one name in different folders (tests/synth/test_pipeline.py and
# tests/policy/test_pipeline.py) are both collected, with no `__init__.py` in the tests tree.
addopts = ["--import-mode=importlib"]
# The Python roots of the "Repository layout" (system design, section 8.1): one package under each,
# and scripts/pipeline, whose scripts are modules the tests import by name. A new module goes into
# an existing root; ruff.toml (`src`) and ty.toml (`root`, `include`) list the same folders, and
# tests/unit/test_layout.py holds the three lists together.
pythonpath = [
    "src",
    "services/common",
    "services/gateway",
    "services/issuer",
    "services/scaler",
    "services/reporter",
    "services/engine/lifecycle",
    "services/engine/mock",
    "client",
    "admin",
    "dashboards",
    "scripts/pipeline",
    # Not roots of the layout. The implement loop's tests (scripts/check.sh engine-tests) read
    # this configuration too, and import their helpers and each other by bare name, which the
    # default import mode allowed by putting each test file's folder on the path. The examiner's
    # probes of the engine, in tests/examiner, import each other the same way.
    "tools/implementation-loop/tests",
    "tests/examiner",
]
