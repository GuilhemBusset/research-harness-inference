# Dependabot proposes version bumps as pull requests; they pass the same `required` check as any
# other change and are merged like any other change. Every update waits a week after a release
# (cooldown), so a compromised release has time to be noticed and pulled before it is proposed
# here. Security updates are not delayed.
version: 2

updates:
  # The actions pinned by commit SHA in .github/workflows/. Dependabot moves the SHA and the
  # version comment together. The tools those workflows download by URL (gitleaks, actionlint)
  # and the uv version are pinned in ci.yml itself and are bumped by hand, with their checksums.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    labels: []

  # No entry for the Python dependencies of uv.lock: most pins also live elsewhere (ruff's
  # required-version, the pytest of the engine tests and of the verifier, the boto3 extra a test
  # asserts), and a bump can change what the gates find, so none merged as proposed. A pin moves
  # by hand, in a change of its own, when an issue needs a newer version.

  # The base images the Dockerfiles under services/ pin by digest: the gateway, Grafana, the mock
  # engine and vLLM. A bump of vLLM's FROM line also needs its VERSION file, which Dependabot does
  # not change: tests/unit/engine/test_vllm_image.py fails until it is. Dependabot expands the pattern
  # with Ruby's Dir.glob: `**/*` is every folder under services/, at any depth, and a folder with
  # no Dockerfile is skipped. Security updates do not wait for the cooldown.
  - package-ecosystem: docker
    directories:
      - '/services/**/*'
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    labels: []

# When the backlog adds it, add `npm` for the CDK CLI pinned in package.json.
