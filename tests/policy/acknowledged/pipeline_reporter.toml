[nag]
"AwsSolutions-L1" = "The reporter runs on the Lambda runtime of the Python that .python-version names, the one its tests and its bundle's libraries are built for, which packaging.RUNTIME holds for every function of the app."
"AwsSolutions-IAM5[Resource::<CodePipelineArtifactsBucketF1E925CF.Arn>/*]" = "The reporter reads the templates that an execution's synth step wrote to the pipeline's own artifact bucket, under an object key CodePipeline only chooses when the execution runs."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:cloudformation:<AWS::Region>:<AWS::AccountId>:stack/Rhi-Network/*]" = "The reporter reads the events of a stack the pipeline deploys, by its fixed name, and CloudFormation adds an identifier it chooses at creation to every stack's ARN."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:cloudformation:<AWS::Region>:<AWS::AccountId>:stack/Rhi-Access/*]" = "The reporter reads the events of a stack the pipeline deploys, by its fixed name, and CloudFormation adds an identifier it chooses at creation to every stack's ARN."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:cloudformation:<AWS::Region>:<AWS::AccountId>:stack/Rhi-Pools/*]" = "The reporter reads the events of a stack the pipeline deploys, by its fixed name, and CloudFormation adds an identifier it chooses at creation to every stack's ARN."
