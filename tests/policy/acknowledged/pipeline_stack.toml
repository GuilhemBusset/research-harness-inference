# What the role of the verification step (`src/rhi/pipeline/verify.py`) may do, each action on each
# resource, with its reason. The step is a step, not a construct: CDK Pipelines creates its project
# and its role inside the pipeline construct of `src/rhi/pipeline/stack.py`, so they are this
# file's. The file's tables hold only what cdk-nag and the wildcard check read, so the inventory
# is written here as comments. `tests/synth/test_pipeline_verify.py` and
# `tests/policy/test_pipeline.py` hold the role to it.
#
# - secretsmanager:GetSecretValue on the secret rhi/canary-key-?????? only: the canary's key, which
#   the smoke tests call the deployed endpoint with.
# - aps:QueryMetrics on the workspaces of the deploying account and region that carry the tag
#   rhi-stage with the name of the stage the step verifies, which is that stage's one workspace:
#   the smoke tests read the gateway's and the pool's metrics, and the release the pool's
#   instances report.
# - ssm:GetParameter on the release parameter of each pool the stage deploys, each by its name,
#   /rhi/pools/<pool>/release: the release the pipeline deployed, which the served one must equal.
#   Before the smoke tests, the step's decision (`scripts/pipeline/gpu_verification.py`) reads the
#   same parameters, and the earlier versions of a GPU pool's, each as <name>:<version>, with this
#   same action.
# - dynamodb:Query on the heartbeats table of the stage the step verifies, and on no other table:
#   when its tests failed, the step reads the heartbeat rows of the pools it tested, by pool, for
#   the last lifecycle stage each instance reached. The table is named by the pattern
#   table/<pools stack's name>-<the table's logical ID>-*, the name CloudFormation gives it.
# - s3:PutObject on verification/* of the pipeline's artifact bucket: the step's marks, which its
#   post-build phase writes itself because a failed action may leave no output artifact. They are
#   the objects verification/<execution ID>/not-run, when no test could run,
#   verification/<execution ID>/failed-smoke-tests, the IDs of the smoke tests that failed, and
#   verification/<execution ID>/last-stages, the last lifecycle stage each instance reached.
# - codepipeline:ListPipelineExecutions on this pipeline, by its ARN, and on no other: the decision
#   reads when this execution started. It compares with that time when each version of a GPU pool's
#   release parameter was written, to find the last version written before the execution started,
#   the release in effect before it, which it compares the current one with. The mock pool's
#   parameter is not compared.
# - cloudformation:DescribeStackResource on the pools stack, stack/<pools stack's name>/*, and on no
#   other stack: the step finds the pool-state table's name by its logical ID in that stack, as the
#   hold step does.
# - dynamodb:GetItem and dynamodb:PutItem on the pool-state table of the stage the step verifies,
#   and on no other table, only for the items whose partition key (dynamodb:LeadingKeys) is the
#   name of a pool the step books, the mock pool's or the coursework pool's: the step reads the
#   pool's session, books one for its run of the smoke tests on a pool that has none booked or
#   active, and stops the session it booked after the run. The table is named by the pattern
#   table/<pools stack's name>-<the table's logical ID>-*, the name CloudFormation gives it.
# - s3:GetBucket*, s3:GetObject* and s3:List* on the pipeline's artifact bucket and its objects:
#   CDK Pipelines' grant to a project that takes an input, here the source the step runs.
# - logs:CreateLogGroup, logs:CreateLogStream and logs:PutLogEvents on the project's own log group,
#   and codebuild:CreateReportGroup, CreateReport, UpdateReport, BatchPutTestCases and
#   BatchPutCodeCoverages on the project's own report groups: CodeBuild's grant to every project.
#
# While the configuration is parked, the step runs no test and its project keeps its logical ID:
# its role holds only s3:PutObject on verification/* of the artifact bucket, for the mark
# verification/<execution ID>/not-run that holds the line parked, beside CDK Pipelines' read of its
# input and CodeBuild's grant above. Every finding of that role is one already listed below.
#
# What the role of the step that copies the weights (`src/rhi/pipeline/weights.py`) may do, held
# the same way: that module creates no resource, so the step's project and role are this file's
# too. `tests/synth/test_weights_job.py` holds the role to it, and `tests/policy/test_pipeline.py`
# holds every other role to writing nothing to the model bucket.
#
# - s3:ListBucket on the model bucket, by its fixed name, rhi-models-<account>-<region>: the job
#   learns what a pool's prefix at a revision holds by listing it, since it may read no object.
# - s3:PutObject on the objects of the model bucket: the files of each GPU pool's manifest, each
#   verified before it is written, under <pool>/<revision>/. The action also covers an upload made
#   in parts.
# - s3:DeleteObject on the objects of the model bucket: the job removes from a pool's prefix at
#   its revision what the manifest no longer lists.
# - ssm:GetParametersByPath on the parameters under /rhi/config: the configuration, which names
#   each GPU pool, its model and its pinned revision.
# - s3:GetBucket*, s3:GetObject* and s3:List* on the pipeline's artifact bucket and its objects:
#   CDK Pipelines' grant to a project that takes an input, here the source the job runs from.
# - logs:CreateLogGroup, logs:CreateLogStream and logs:PutLogEvents on the project's own log group,
#   and codebuild:CreateReportGroup, CreateReport, UpdateReport, BatchPutTestCases and
#   BatchPutCodeCoverages on the project's own report groups: CodeBuild's grant to every project.
#
# What the role of the step that holds the deployment while a session is on
# (`src/rhi/pipeline/hold.py`) may do, held the same way: that module creates no resource, so the
# step's project and role are this file's too. `tests/synth/test_pipeline_hold.py` and
# `tests/policy/test_pipeline.py` hold the role to it.
#
# - cloudformation:DescribeStackResource on the pools stack, stack/<pools stack's name>/*, and on no
#   other stack: the job finds the pool-state table's name by its logical ID in that stack.
# - dynamodb:GetItem on the pool-state table of the stage, and on no other table: the job reads the
#   session of each pool of the stage, one item for each pool, and holds the deployment while one
#   is active. The table is named by the pattern
#   table/<pools stack's name>-<the table's logical ID>-*, the name CloudFormation gives it.
# - s3:GetBucket*, s3:GetObject* and s3:List* on the pipeline's artifact bucket and its objects:
#   CDK Pipelines' grant to a project that takes an input, here the source the job runs from.
# - logs:CreateLogGroup, logs:CreateLogStream and logs:PutLogEvents on the project's own log group,
#   and codebuild:CreateReportGroup, CreateReport, UpdateReport, BatchPutTestCases and
#   BatchPutCodeCoverages on the project's own report groups: CodeBuild's grant to every project.
#
# What the role of the step that copies the pinned images into the private mirror
# (`src/rhi/pipeline/mirror.py`) may do, held the same way: the step's project and role are CDK
# Pipelines', inside the pipeline construct, so they are this file's too; the repositories that
# module creates bring no finding. `tests/synth/test_pipeline_mirror.py` holds the role to it.
#
# - ecr:GetAuthorizationToken on every resource: the token the job logs crane in to the account's
#   registry with. AWS grants it only on every resource.
# - ecr:BatchGetImage, ecr:GetDownloadUrlForLayer and ecr:BatchCheckLayerAvailability (pull),
#   ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload and ecr:PutImage (push),
#   and ecr:DescribeImages (describe), on the repositories whose names start with rhi-mirror/, in
#   the deploying account and region, and on no other repository. No ecr:CreateRepository.
# - s3:GetBucket*, s3:GetObject* and s3:List* on the pipeline's artifact bucket and its objects:
#   CDK Pipelines' grant to a project that takes an input, here the source the job runs from.
# - logs:CreateLogGroup, logs:CreateLogStream and logs:PutLogEvents on the project's own log group,
#   and codebuild:CreateReportGroup, CreateReport, UpdateReport, BatchPutTestCases and
#   BatchPutCodeCoverages on the project's own report groups: CodeBuild's grant to every project.
#
# What `src/rhi/pipeline/mirror.py` adds to the role CDK Pipelines shares among the projects that
# publish images (`Assets/DockerRole`), beside what CDK Pipelines gives it: the project's Docker
# daemon logs in to the account's registry with this role and pulls the emulator and BuildKit from
# the mirror before `cdk-assets` runs. `tests/synth/test_pipeline_mirror.py` holds the role to it.
#
# - ecr:GetAuthorizationToken on every resource: the token Docker logs in to the account's registry
#   with. AWS grants it only on every resource, and CDK Pipelines already grants it to this role.
# - ecr:BatchGetImage, ecr:GetDownloadUrlForLayer and ecr:BatchCheckLayerAvailability (pull) on
#   the repositories rhi-mirror/tonistiigi/binfmt and rhi-mirror/moby/buildkit, each by its ARN,
#   and on no other repository. No push.
#
# The base images of the FROM lines are pulled by BuildKit with the login `cdk-assets` makes with
# the bootstrap's image-publishing role, which the policy of each mirror repository lets pull its
# images, and nothing more: a repository's policy names no other principal and allows no push.

