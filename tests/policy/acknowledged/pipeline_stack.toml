# What the role of the verification step (`src/rhi/pipeline/verify.py`) may do, each action on each
# resource, with its reason. The step is a step, not a construct: CDK Pipelines creates its project
# and its role inside the pipeline construct of `src/rhi/pipeline/stack.py`, so they are this
# file's. The file's tables hold only what cdk-nag and the wildcard check read, so the inventory
# is written here as comments. `tests/synth/test_pipeline_verify.py` and
# `tests/policy/test_pipeline.py` hold the role to it.
#
# - secretsmanager:GetSecretValue on the secret rhi/canary-key-?????? only: the canary's key, which
#   the smoke tests call the deployed endpoint with.
# - aps:QueryMetrics on the workspaces of the deploying account and region that carry the tag
#   rhi-stage with the name of the stage the step verifies, which is that stage's one workspace:
#   the smoke tests read the gateway's and the pool's metrics, and the release the pool's
#   instances report.
# - ssm:GetParameter on the release parameter of each pool the stage deploys, each by its name,
#   /rhi/pools/<pool>/release: the release the pipeline deployed, which the served one must equal.
# - dynamodb:Query on the heartbeats table of the stage the step verifies, and on no other table:
#   when its tests failed, the step reads the heartbeat rows of the pools it tested, by pool, for
#   the last lifecycle stage each instance reached. The table is named by the pattern
#   table/<pools stack's name>-<the table's logical ID>-*, the name CloudFormation gives it.
# - s3:PutObject on verification/* of the pipeline's artifact bucket: the step's marks, which its
#   post-build phase writes itself because a failed action may leave no output artifact. They are
#   the objects verification/<execution ID>/not-run, when no test could run,
#   verification/<execution ID>/failed-smoke-tests, the IDs of the smoke tests that failed, and
#   verification/<execution ID>/last-stages, the last lifecycle stage each instance reached.
# - autoscaling:DescribeAutoScalingGroups and autoscaling:DescribeInstanceRefreshes on every
#   resource, the only resource AWS grants them on: before the smoke tests, the step's decision
#   finds each GPU pool's group by its tags rhi-pool and rhi-engine and reads its instance
#   refreshes, to learn whether this execution started one and to wait for it to end.
# - codepipeline:ListPipelineExecutions on this pipeline, by its ARN, and on no other: the decision
#   reads when this execution started, which a refresh must have begun after.
# - s3:GetBucket*, s3:GetObject* and s3:List* on the pipeline's artifact bucket and its objects:
#   CDK Pipelines' grant to a project that takes an input, here the source the step runs.
# - logs:CreateLogGroup, logs:CreateLogStream and logs:PutLogEvents on the project's own log group,
#   and codebuild:CreateReportGroup, CreateReport, UpdateReport, BatchPutTestCases and
#   BatchPutCodeCoverages on the project's own report groups: CodeBuild's grant to every project.
#
# While the configuration is parked, the step runs no test and its project keeps its logical ID:
# its role holds only s3:PutObject on verification/* of the artifact bucket, for the mark
# verification/<execution ID>/not-run that holds the line parked, beside CDK Pipelines' read of its
# input and CodeBuild's grant above. Every finding of that role is one already listed below.
#
# What the role of the step that copies the weights (`src/rhi/pipeline/weights.py`) may do, held
# the same way: that module creates no resource, so the step's project and role are this file's
# too. `tests/synth/test_weights_job.py` holds the role to it, and `tests/policy/test_pipeline.py`
# holds every other role to writing nothing to the model bucket.
#
# - s3:ListBucket on the model bucket, by its fixed name, rhi-models-<account>-<region>: the job
#   learns what a pool's prefix at a revision holds by listing it, since it may read no object.
# - s3:PutObject on the objects of the model bucket: the files of each GPU pool's manifest, each
#   verified before it is written, under <pool>/<revision>/. The action also covers an upload made
#   in parts.
# - s3:DeleteObject on the objects of the model bucket: the job removes from a pool's prefix at
#   its revision what the manifest no longer lists.
# - ssm:GetParametersByPath on the parameters under /rhi/config: the configuration, which names
#   each GPU pool, its model and its pinned revision.
# - s3:GetBucket*, s3:GetObject* and s3:List* on the pipeline's artifact bucket and its objects:
#   CDK Pipelines' grant to a project that takes an input, here the source the job runs from.
# - logs:CreateLogGroup, logs:CreateLogStream and logs:PutLogEvents on the project's own log group,
#   and codebuild:CreateReportGroup, CreateReport, UpdateReport, BatchPutTestCases and
#   BatchPutCodeCoverages on the project's own report groups: CodeBuild's grant to every project.
#
# What the role of the step that holds the deployment while a session is on
# (`src/rhi/pipeline/hold.py`) may do, held the same way: that module creates no resource, so the
# step's project and role are this file's too. `tests/synth/test_pipeline_hold.py` and
# `tests/policy/test_pipeline.py` hold the role to it.
#
# - cloudformation:DescribeStackResource on the pools stack, stack/<pools stack's name>/*, and on no
#   other stack: the job finds the pool-state table's name by its logical ID in that stack.
# - dynamodb:GetItem on the pool-state table of the stage, and on no other table: the job reads the
#   session switch, one item of it. The table is named by the pattern
#   table/<pools stack's name>-<the table's logical ID>-*, the name CloudFormation gives it.
# - s3:GetBucket*, s3:GetObject* and s3:List* on the pipeline's artifact bucket and its objects:
#   CDK Pipelines' grant to a project that takes an input, here the source the job runs from.
# - logs:CreateLogGroup, logs:CreateLogStream and logs:PutLogEvents on the project's own log group,
#   and codebuild:CreateReportGroup, CreateReport, UpdateReport, BatchPutTestCases and
#   BatchPutCodeCoverages on the project's own report groups: CodeBuild's grant to every project.

[nag]
"AwsSolutions-S1" = "The pipeline's artifact bucket keeps no server access logs: only the pipeline's own roles reach it, CloudTrail records who changes it, and a bucket of access logs would add storage and its cost that nothing in the design reads."
"AwsSolutions-CB4" = "The pipeline's CodeBuild projects encrypt their artifacts with the key AWS manages for S3, the default; a customer managed key would add a monthly cost and a key policy to keep, and the artifacts hold nothing but this public repository and what is synthesized from it."
"AwsSolutions-IAM5[Action::s3:Abort*]" = "CDK Pipelines grants the pipeline's roles this group of S3 actions on the pipeline's artifact bucket and its objects only."
"AwsSolutions-IAM5[Action::s3:DeleteObject*]" = "CDK Pipelines grants the pipeline's roles this group of S3 actions on the pipeline's artifact bucket and its objects only."
"AwsSolutions-IAM5[Action::s3:GetBucket*]" = "CDK Pipelines grants the pipeline's roles this group of S3 actions on the pipeline's artifact bucket and its objects only."
"AwsSolutions-IAM5[Action::s3:GetObject*]" = "CDK Pipelines grants the pipeline's roles this group of S3 actions on the pipeline's artifact bucket and its objects only."
"AwsSolutions-IAM5[Action::s3:List*]" = "CDK Pipelines grants the pipeline's roles this group of S3 actions on the pipeline's artifact bucket and its objects only."
"AwsSolutions-IAM5[Resource::<CodePipelineArtifactsBucketF1E925CF.Arn>/*]" = "The pipeline's roles read and write the artifacts of every execution, whose object keys are only known when the execution runs, in the pipeline's own artifact bucket."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:logs:<AWS::Region>:<AWS::AccountId>:log-group:/aws/codebuild/<CodePipelineBuildSynthCdkBuildProjectEDF0E7B6>:*]" = "The synth project writes to the streams of its own log group, whose names CodeBuild chooses for each build."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:codebuild:<AWS::Region>:<AWS::AccountId>:report-group/<CodePipelineBuildSynthCdkBuildProjectEDF0E7B6>-*]" = "The synth project writes the test reports of its own report groups, whose names CodeBuild derives from the project's name."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:ssm:<AWS::Region>:<AWS::AccountId>:parameter/rhi/config/*]" = "The synth step and the step that copies the weights each read the configuration by its path, every parameter under the configuration prefix, whose keys the configuration loader adds to, and no other parameter."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:logs:<AWS::Region>:<AWS::AccountId>:log-group:/aws/codebuild/<CodePipelineRhiVerifyB6860032>:*]" = "The verification project writes to the streams of its own log group, whose names CodeBuild chooses for each build."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:codebuild:<AWS::Region>:<AWS::AccountId>:report-group/<CodePipelineRhiVerifyB6860032>-*]" = "The verification project writes the test reports of its own report groups, whose names CodeBuild derives from the project's name."
"AwsSolutions-IAM5[Resource::<CodePipelineArtifactsBucketF1E925CF.Arn>/verification/*]" = "The verification step writes, under the prefix verification/ of the pipeline's own artifact bucket and nowhere else, an object whose key holds the execution's ID, which is only known when the execution runs."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:aps:<AWS::Region>:<AWS::AccountId>:workspace/*]" = "The verification step queries the workspace of the stage it verifies, whose ID is only chosen when the stage is first deployed, after this stack; the statement's condition admits only a workspace tagged with that stage's name."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:dynamodb:<AWS::Region>:<AWS::AccountId>:table/Rhi-Pools-TablesHeartbeats613D6AB3-*]" = "The verification step queries the heartbeats table of the stage it verifies, which this stack cannot refer to across assemblies and so names by the pools stack's name and the table's logical ID; the wildcard stands for the suffix CloudFormation generates for the table's name, and a logical ID holds no hyphen, so no other table matches."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:logs:<AWS::Region>:<AWS::AccountId>:log-group:/aws/codebuild/<CodePipelineRhiCopyWeights2FCF9F70>:*]" = "The project that copies the weights writes to the streams of its own log group, whose names CodeBuild chooses for each build."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:codebuild:<AWS::Region>:<AWS::AccountId>:report-group/<CodePipelineRhiCopyWeights2FCF9F70>-*]" = "The project that copies the weights writes the test reports of its own report groups, whose names CodeBuild derives from the project's name."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:s3:::rhi-models-<AWS::AccountId>-<AWS::Region>/*]" = "The step that copies the weights writes each GPU pool's files under the pool's name and its revision, which only the configuration in SSM gives, and removes what a manifest no longer lists; it is the one writer of the model bucket, and may read none of its objects."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:logs:<AWS::Region>:<AWS::AccountId>:log-group:/aws/codebuild/<PipelineUpdatePipelineSelfMutationDAA41400>:*]" = "The self-update project writes to the streams of its own log group, whose names CodeBuild chooses for each build."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:codebuild:<AWS::Region>:<AWS::AccountId>:report-group/<PipelineUpdatePipelineSelfMutationDAA41400>-*]" = "The self-update project writes the test reports of its own report groups, whose names CodeBuild derives from the project's name."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:logs:<AWS::Region>:<AWS::AccountId>:log-group:/aws/codebuild/*]" = "CDK Pipelines shares one role among the asset-publishing projects, whose number grows with the assets, so the role writes to the CodeBuild log groups of the account rather than to one project's."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:codebuild:<AWS::Region>:<AWS::AccountId>:report-group/*]" = "CDK Pipelines shares one role among the asset-publishing projects, whose number grows with the assets, so the role writes to the CodeBuild report groups of the account rather than to one project's."
"AwsSolutions-IAM5[Resource::arn:*:iam::<AWS::AccountId>:role/*]" = "The self-update assumes the bootstrap roles of the deploying account, which its condition selects by their bootstrap tag, so that the CDK CLI can publish the pipeline's assets and deploy the pipeline stack."
"AwsSolutions-IAM5[Resource::*]" = "CDK Pipelines writes these statements on every resource, each action listed with its reason in the wildcard_actions table of this module; the bounded bootstrap's permissions boundary still caps every role that holds one."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:logs:<AWS::Region>:<AWS::AccountId>:log-group:/aws/codebuild/<CodePipelineRhiHoldC6295550>:*]" = "The project that holds the deployment while a session is on writes to the streams of its own log group, whose names CodeBuild chooses for each build."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:codebuild:<AWS::Region>:<AWS::AccountId>:report-group/<CodePipelineRhiHoldC6295550>-*]" = "The project that holds the deployment while a session is on writes the test reports of its own report groups, whose names CodeBuild derives from the project's name."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:cloudformation:<AWS::Region>:<AWS::AccountId>:stack/Rhi-Pools/*]" = "The hold step finds the pool-state table's name by its logical ID in the pools stack, which it names by the stack's name; the wildcard stands for the stack's ID, which CloudFormation generates when the stack is created, so the pattern matches that one stack."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:dynamodb:<AWS::Region>:<AWS::AccountId>:table/Rhi-Pools-TablesPoolState68A872F7-*]" = "The hold step reads the session switch from the stage's pool-state table, which this stack cannot refer to across assemblies and so names by the pools stack's name and the table's logical ID; the wildcard stands for the suffix CloudFormation generates for the table's name, and a logical ID holds no hyphen, so no other table matches."


[wildcard_actions]
"cloudformation:DescribeStacks" = "The self-update reads the state of the stacks it deploys, the pipeline stack and the bootstrap stack, whose names the CDK CLI resolves when it runs."
"s3:ListBucket" = "The self-update lists the bootstrap's asset bucket, whose name the CDK CLI reads from the bootstrap stack when it runs."
"codebuild:BatchGetBuilds" = "CDK Pipelines grants the role it shares among the asset-publishing projects this action on every resource, because the projects multiply with the assets."
"codebuild:StartBuild" = "CDK Pipelines grants the role it shares among the asset-publishing projects this action on every resource, because the projects multiply with the assets."
"codebuild:StopBuild" = "CDK Pipelines grants the role it shares among the asset-publishing projects this action on every resource, because the projects multiply with the assets."
"autoscaling:DescribeAutoScalingGroups" = "The verification step's decision finds each GPU pool's group by its tags rhi-pool and rhi-engine, which it reads with the group; AWS grants describing groups on every resource only, and the action reads, never changes, a group."
"autoscaling:DescribeInstanceRefreshes" = "The verification step's decision reads the instance refreshes of each GPU pool's group, to learn whether this execution started one and to wait for it to end; AWS grants describing refreshes on every resource only, and the action reads, never changes, a refresh."
