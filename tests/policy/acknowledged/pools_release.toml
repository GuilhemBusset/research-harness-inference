# What the roles of `src/rhi/pools/release.py` may do, each action on each resource, with its reason.
# The file's tables hold only what cdk-nag and the wildcard check read, so the inventory is
# written here as comments.
#
# The policy each pool's release attaches to the pool's instance role (`pools_role.toml`):
# - ssm:GetParameter on the pool's release parameter, /rhi/pools/<pool>/release, and no other: the
#   boot program and the lifecycle agent read the release at every start.
# - s3:GetObject on the one object of the release's archive in the bootstrap's bucket, and no
#   other: the boot program fetches the unit files, the collector's configuration and the agent.
# - ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer and ecr:BatchGetImage on the
#   bootstrap's repository, where the asset step pushes the pool's engine image: the host pulls it.
# - ecr:GetAuthorizationToken on every resource: the host logs in to the registry before it pulls.
#
# The policy of each pool's custom resource that reads the image's digest, attached to the role of
# the function the CDK shares among the stack's AWS SDK custom resources (`pools_stack.toml`):
# - ecr:DescribeImages on the bootstrap's repository: the release names the image by the digest
#   the registry gave it, read for the asset's tag when the stack is deployed.

[nag]
"AwsSolutions-IAM5[Resource::*]" = "AWS grants ecr:GetAuthorizationToken on every resource only; the statement that names every resource holds that one action."

[wildcard_actions]
"ecr:GetAuthorizationToken" = "AWS grants the registry's authorization token on every resource only; an instance needs it to log in before it pulls its pool's engine image, and the pull itself is granted on the one repository."
