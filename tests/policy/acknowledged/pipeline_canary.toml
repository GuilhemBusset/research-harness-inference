# What the roles of the weekly GPU canary (`src/rhi/pipeline/canary.py`) may do, each action on
# each resource, with its reason. The file's tables hold only what cdk-nag and the wildcard check
# read, so the inventory is written here as comments. `tests/synth/test_canary.py` and
# `tests/policy/test_pipeline.py` hold the roles to it.
#
# The job's role, given to its project as a role that takes no new statement, so these are all its
# statements:
# - secretsmanager:GetSecretValue on the secret rhi/canary-key-?????? only: the canary's key, with
#   which the smoke tests reach the coursework pool through the gateway. No other secret.
# - aps:DescribeWorkspace and aps:QueryMetrics on workspace/* of the deploying account and region,
#   under the condition that the workspace carries the tag rhi-stage with the stage's name: the
#   workspace's query address, then the queries of the smoke tests that read the pool's metrics
#   and the release its instances report.
# - aps:ListWorkspaces on every resource, which is the only resource AWS grants it on: the job finds
#   the ID of its stage's workspace among the workspaces' tags, since the stage's output that holds
#   the query address cannot reach a job outside the pipeline's actions.
# - ssm:GetParameter on the release parameter of each pool the stage deploys,
#   parameter/rhi/pools/<pool>/release, each by its name: the release the smoke tests compare with
#   the one the pool serves.
# - events:PutEvents on event-bus/rhi-measurements only, through `measuring_job`: the measurement
#   gpu-canary, handed to the reporter, since a job holds no GitHub credential.
# - codeconnections:GetConnection and codeconnections:GetConnectionToken on the pipeline's
#   connection only: CodeBuild reads this repository through it, as CodeBuild's user guide asks of a
#   project's role.
# - logs:CreateLogStream and logs:PutLogEvents on the job's log group, /aws/codebuild/rhi-gpu-canary,
#   only: the job's logs.
# Nothing of CodePipeline, DynamoDB, Auto Scaling, EC2 or IAM, and no report group: the project
# declares none.
#
# The schedule's role, which EventBridge assumes to start the job:
# - codebuild:StartBuild on the canary's project only. Nothing else.
#
# What the AWS Solutions pack finds on the project is fixed where it can be: the project runs
# CodeBuild's standard image (AwsSolutions-CB5) and is not privileged (AwsSolutions-CB3). The key
# AWS manages encrypts what CodeBuild stores of a build (AwsSolutions-CB4), acknowledged below.

[nag]
"AwsSolutions-CB4" = "The canary's project keeps no artifact and encrypts what CodeBuild stores with the key AWS manages, the default; a customer managed key would add a monthly cost and a key policy to keep for a build that holds nothing but this public repository."
"AwsSolutions-IAM5[Resource::arn:<AWS::Partition>:aps:<AWS::Region>:<AWS::AccountId>:workspace/*]" = "The canary describes and queries the stage's workspace, whose ID is only chosen when the stage is deployed; the statement's condition admits only the workspace tagged with the stage's name."
"AwsSolutions-IAM5[Resource::*]" = "The canary lists the workspaces to find its stage's by its tag, which AWS grants only on every resource; the action is listed with its reason in the wildcard_actions table of this module."

[wildcard_actions]
"aps:ListWorkspaces" = "The canary finds the ID of its stage's workspace by the workspace's tag, and Managed Prometheus grants listing workspaces only on every resource."
