# What the roles of `src/rhi/pools/secret.py` may do, each action on each resource, with its reason.
# The file's tables hold only what cdk-nag and the wildcard check read, so the inventory is
# written here as comments.
#
# The module creates no role. It grants each pool's instance role (`pools_role.toml`), on that
# pool's bearer secret alone, by the secret's ARN written with its fixed name,
# /rhi/pools/<pool>/bearer, and the six characters Secrets Manager adds to it:
# - secretsmanager:GetSecretValue and secretsmanager:DescribeSecret: an engine reads its pool's
#   bearer secret when it starts. The secret is encrypted with the account's key for Secrets
#   Manager, so no KMS action is granted.
# Another construct that is allowed to read a pool's secret, the gateway's, lists its grant in its
# own module's file.

[nag]
"AwsSolutions-SMG4" = "Rotation is not part of phase 1, because a rotated bearer secret needs every engine of the pool and the gateway restarted to take the new value."
