# What the roles of `src/rhi/pools/stack.py` may do, each action on each resource, with its reason.
# The file's tables hold only what cdk-nag and the wildcard check read, so the inventory is
# written here as comments.
#
# The role of the function the CDK puts at the stack's root for its AWS SDK custom resources (the
# one that suspends each pool group's zone rebalancing, `pools_group.toml`, and the one that reads
# the digest of each pool's engine image, `pools_release.toml`):
# - logs:CreateLogGroup, logs:CreateLogStream and logs:PutLogEvents on every resource, through the
#   AWS managed policy AWSLambdaBasicExecutionRole: the function writes its own logs.
# Each custom resource attaches its own policy to that role, in the module that created it.
#
# The stack holds the model bucket (`pools_model_store.toml`) and gives no role an action on it:
# it tells each GPU pool's instance role that it reads its pool's weights, and that role's module
# makes the grant (`pools_role.toml`).

[nag]
"AwsSolutions-IAM4[Policy::arn:<AWS::Partition>:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]" = "The CDK gives the function that runs the stack's AWS SDK custom resources the AWS managed policy for writing its own logs, which grants nothing else."

[wildcard_actions]
"logs:CreateLogGroup" = "The function that runs the stack's AWS SDK custom resources holds the AWS managed policy AWSLambdaBasicExecutionRole, which grants this action on every resource so that the function can create its own log group, whose name is generated at deployment after the role exists."
"logs:CreateLogStream" = "The same function's AWSLambdaBasicExecutionRole grants this action on every resource so that the function can open a stream in its own log group, whose name is generated at deployment after the role exists."
"logs:PutLogEvents" = "The same function's AWSLambdaBasicExecutionRole grants this action on every resource so that the function can write its log events to its own log group, whose name is generated at deployment after the role exists."
