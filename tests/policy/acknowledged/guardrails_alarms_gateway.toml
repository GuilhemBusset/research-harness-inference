# What the roles of `src/rhi/guardrails/alarms_gateway.py` may do, each action on each resource,
# with its reason, and the cdk-nag findings its resources bring.
#
# The module creates a CloudWatch Logs metric filter and a CloudWatch alarm only. Neither holds a
# role: CloudWatch publishes to the alerts topic as the service `cloudwatch.amazonaws.com`, which
# the topic's own policy allows (`src/rhi/guardrails/alerts.py`). So the module lists no action,
# and its resources bring no cdk-nag finding to acknowledge.
