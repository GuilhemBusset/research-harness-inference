# What the role of `src/rhi/pools/group.py` may do, each action on each resource, with its reason.
# The file's tables hold only what cdk-nag and the wildcard check read, so the inventory is
# written here as comments.
#
# The policy of each pool's custom resource that suspends zone rebalancing, attached to the role
# of the function the CDK shares among the stack's custom resources (`pools_stack.toml`):
# - autoscaling:SuspendProcesses on the pool's own group only, a group ARN whose condition is the
#   group's tag rhi-pool with the pool's name: the custom resource suspends the group's process
#   AZRebalance when the group is created or replaced.
#
# The launch template gives its instances the pool's role through an instance profile it makes,
# which holds no action of its own: what that role may do is listed in `pools_role.toml`.
#
# The tags rhi-pool and rhi-engine on the group and on the launch template, and the machine image
# the launch template names (a GPU pool's comes from `src/rhi/pools/image.py`, `pools_image.toml`),
# bring no role, no action and no cdk-nag finding.
#
# The volume of 150 GB the launch template gives a GPU pool's instances, encrypted like the mock
# pool's, is a property of the launch template: it brings no role, no action and no cdk-nag finding.
#
# The warm pool and the nightly scheduled action that sets the desired capacity to zero are
# resources Auto Scaling acts on with its own service-linked role: they bring no role of this
# module, no action and no cdk-nag finding.

